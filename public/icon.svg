<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with squircle shape for Android feel -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#312e81" stroke-width="6" opacity="0.6" />

  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#6366f1" stroke-width="3" opacity="0.4" />

  <!-- Sound Waves (Left & Right) -->
  <path d="M 120 220 Q 100 256 120 292" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <path d="M 90 190 Q 60 256 90 322" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" opacity="0.6" />

  <path d="M 392 220 Q 412 256 392 292" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
  <path d="M 422 190 Q 452 256 422 322" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" opacity="0.6" />

  <!-- Center Microphone Symbol -->
  <!-- Mic Capsule -->
  <rect x="216" y="150" width="80" height="140" rx="40" fill="url(#accentGrad)" filter="url(#glow)" />
  
  <!-- Mic Arc / Cradle -->
  <path d="M 176 240 C 176 300 336 300 336 240" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <!-- Mic Stand & Base -->
  <path d="M 256 295 L 256 350" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
  <path d="M 200 350 L 312 350" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />

  <!-- Sparkle stars representing AI -->
  <path d="M 330 140 Q 340 140 345 130 Q 350 140 360 145 Q 350 150 345 160 Q 340 150 330 145 Z" fill="#34d399" />
  <path d="M 160 160 Q 166 160 170 154 Q 174 160 180 163 Q 174 166 170 172 Q 166 166 160 163 Z" fill="#818cf8" />
</svg>
